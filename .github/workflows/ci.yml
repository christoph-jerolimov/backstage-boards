name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The root package.json declares "22 || 24"; CI pins the lower bound.
  NODE_VERSION: '22'

jobs:
  verify:
    name: Format, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check formatting
        run: yarn prettier:check

      - name: Lint
        run: yarn lint:all

      - name: Typecheck
        run: yarn tsc:full

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test:all

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # Packages consume each other's generated types, so declarations
      # have to exist before the bundles are built.
      - name: Generate type declarations
        run: yarn tsc

      - name: Build all packages
        run: yarn build:all

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # Keyed on the browser's own version so an unrelated dependency
      # bump does not evict a perfectly good download.
      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # generateProjects() pins channel: 'chrome', so this needs real
      # Google Chrome rather than the bundled Chromium build.
      - name: Install Chrome
        run: yarn playwright install --with-deps chrome

      - name: Generate type declarations
        run: yarn tsc

      # The suite runs against the built frontend bundle, which the
      # backend serves from packages/app/dist.
      - name: Build all packages
        run: yarn build:all

      # playwright.config.ts drops its webServer entries under CI and
      # points baseURL at :7007, so the workflow starts the server.
      - name: Start backend
        run: |
          nohup yarn workspace backend start > backend.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:7007/ -o /dev/null; then
              echo "Backend is serving on :7007"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not start within 120s" >&2
          cat backend.log >&2
          exit 1
        env:
          # The app is served from the same origin it talks to.
          APP_CONFIG_app_baseUrl: http://localhost:7007
          APP_CONFIG_backend_cors_origin: http://localhost:7007

      - name: Run end-to-end tests
        run: yarn test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e-test-report/
            backend.log
          retention-days: 7
